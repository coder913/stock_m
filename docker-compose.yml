x-worker-environment: &worker-environment
  DATABASE_URL: postgresql://stock_m:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/stock_m
  REDIS_URL: redis://redis:6379
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  INTERNAL_API_BASE_URL: http://web-api:8787
  SEC_USER_AGENT: ${SEC_USER_AGENT:?SEC_USER_AGENT is required}
  ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
  ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
  FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  MONITOR_WORKER_CONCURRENCY: ${MONITOR_WORKER_CONCURRENCY:-1}
  NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-1}
  TRADING_WORKER_CONCURRENCY: ${TRADING_WORKER_CONCURRENCY:-1}
  ALPACA_PAPER_TRADING_ENABLED: ${ALPACA_PAPER_TRADING_ENABLED:-false}
  ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
  ALPACA_ORDER_PREVIEW_SIGNING_KEY: ${ALPACA_ORDER_PREVIEW_SIGNING_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${PUSH_SUBSCRIPTION_ENCRYPTION_KEY:-}

services:
  web-api:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://stock_m:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/stock_m
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      SEC_USER_AGENT: ${SEC_USER_AGENT:?SEC_USER_AGENT is required}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_SUBSCRIPTION_ENCRYPTION_KEY: ${PUSH_SUBSCRIPTION_ENCRYPTION_KEY:-}
      ALPACA_PAPER_TRADING_ENABLED: ${ALPACA_PAPER_TRADING_ENABLED:-false}
      ALPACA_TRADING_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_ORDER_PREVIEW_SIGNING_KEY: ${ALPACA_ORDER_PREVIEW_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
      - backend
    stop_grace_period: 25s

  monitor-worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker:monitor"]
    environment: *worker-environment
    depends_on:
      web-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health", "--", "monitor"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - backend
    stop_grace_period: 25s

  notification-worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker:notifications"]
    environment: *worker-environment
    depends_on:
      web-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health", "--", "notifications"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - backend
    stop_grace_period: 25s

  trading-worker:
    profiles: ["paper-trading"]
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker:trading"]
    environment: *worker-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health", "--", "trading"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks:
      - backend
    stop_grace_period: 25s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_m
      POSTGRES_USER: stock_m
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_m -d stock_m"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
